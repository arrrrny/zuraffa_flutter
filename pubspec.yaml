name: zuraffa_flutter
description: Flutter UI layer for Zuraffa — views, controllers, presenters, shells, xray, and state widgets.
version: 7.2.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa
issue_tracker: https://github.com/arrrrny/zuraffa/issues

topics:
  - clean-architecture
  - state-management
  - flutter
  - ui

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  responsive_builder: ^0.7.1
  go_router: ^18.0.2
  zuraffa: ^7.2.0
  zuraffa_ui: ^0.4.0
  yaml: ^3.1.4
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Transported VPC tests (issues #431 / #435) parse generated output with
  # package:analyzer and build fixture paths with package:path. Both are
  # already in the transitive graph but are declared directly here.
  analyzer: ^14.0.0
  path: ^1.9.1

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
